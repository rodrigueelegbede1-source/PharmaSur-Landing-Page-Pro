<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>PharmaSur — marque</title>
  <defs>
    <linearGradient id="ps-marque" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a06f" />
      <stop offset="100%" stop-color="#10714f" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="144" fill="url(#ps-marque)" />
  <!--
    Repère tracé dans un repère 24×24 puis mis à l'échelle. L'épaisseur du trait
    subit la même échelle : elle reste donc exprimée en unités locales (2), et non
    en pixels du canevas. La translation centre la boîte du pictogramme, dont le
    centre local est (12 ; 16,5) et non (12 ; 12).
  -->
  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(76 8.5) scale(15)"
  >
    <path d="M12 25s-7-4.8-7-10a7 7 0 1 1 14 0c0 5.2-7 10-7 10Z" />
    <path d="M12 12v6M9 15h6" />
  </g>
</svg>
