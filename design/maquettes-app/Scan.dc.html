<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #2fbc86; } a:hover { color: #d9f2e7; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #062a1d; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; inset: 0; background: radial-gradient(420px 380px at 50% 42%, #14342a, #042116 72%);"></div>

  <div style="position: relative; padding: 24px 20px 0; display: flex; align-items: center; justify-content: space-between;">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#d9f2e7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8h-11M7 3.5 2.5 8 7 12.5"></path></svg>
    <span style="font-size: 15px; font-weight: 800; color: #ffffff;">Authentifier une boîte</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7b8b84" stroke-width="2" stroke-linecap="round"><path d="M12 17v.01"></path><circle cx="12" cy="12" r="9"></circle><path d="M12 13.5c0-2 2.5-2 2.5-4a2.5 2.5 0 1 0-5 0"></path></svg>
  </div>

  <div style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center;">
    <div style="width: 250px; height: 250px; position: relative;">

      <div style="position: absolute; inset: 34px 26px; border-radius: 10px; background: linear-gradient(150deg, #2a4d40, #1b382d); box-shadow: 0 30px 70px rgb(11 61 44 / 0.16);"></div>
      <div style="position: absolute; left: 46px; right: 46px; top: 76px; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.16);"></div>
      <div style="position: absolute; left: 46px; width: 96px; top: 94px; height: 7px; border-radius: 3px; background: rgba(255,255,255,0.1);"></div>
      <div style="position: absolute; left: 46px; right: 46px; bottom: 74px; height: 34px; border-radius: 4px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.72) 0 3px, transparent 3px 7px);"></div>

      <div style="position: absolute; left: 0; top: 0; width: 42px; height: 42px; border-top: 3.5px solid #2fbc86; border-left: 3.5px solid #2fbc86; border-radius: 14px 0 0 0;"></div>
      <div style="position: absolute; right: 0; top: 0; width: 42px; height: 42px; border-top: 3.5px solid #2fbc86; border-right: 3.5px solid #2fbc86; border-radius: 0 14px 0 0;"></div>
      <div style="position: absolute; left: 0; bottom: 0; width: 42px; height: 42px; border-bottom: 3.5px solid #2fbc86; border-left: 3.5px solid #2fbc86; border-radius: 0 0 0 14px;"></div>
      <div style="position: absolute; right: 0; bottom: 0; width: 42px; height: 42px; border-bottom: 3.5px solid #2fbc86; border-right: 3.5px solid #2fbc86; border-radius: 0 0 14px 0;"></div>

      <div style="position: absolute; left: 8px; right: 8px; top: 124px; height: 2px; background: #2fbc86; box-shadow: 0 0 18px 3px rgba(47,188,134,0.55);"></div>
    </div>
  </div>

  <div style="position: relative; padding: 0 40px 40px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <p style="margin: 0; font-size: 17px; font-weight: 800; color: #ffffff; text-align: center;">Cadrez le code de la boîte</p>
    <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #b9e8d3; text-align: center; text-wrap: pretty;">Le code se trouve généralement sous le rabat, à côté du numéro de lot.</p>
  </div>

  <div style="position: relative; display: flex; border-top: 1px solid rgba(255,255,255,0.1); padding: 10px 8px 22px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; min-height: 44px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#7b8b84" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
      <span style="font-size: 11px; font-weight: 600; color: #7b8b84;">Recherche</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; min-height: 44px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#2fbc86" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 12h10"></path></svg>
      <span style="font-size: 11px; font-weight: 700; color: #2fbc86;">Scan</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; min-height: 44px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#7b8b84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3Z"></path><path d="M9 4v13M15 7v13"></path></svg>
      <span style="font-size: 11px; font-weight: 600; color: #7b8b84;">Carte</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; min-height: 44px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#7b8b84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M5 21c0-3.9 3.1-7 7-7s7 3.1 7 7"></path></svg>
      <span style="font-size: 11px; font-weight: 600; color: #7b8b84;">Profil</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
