<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #2fbc86; } a:hover { color: #d9f2e7; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0b3d2c; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; inset: 0; background: radial-gradient(460px 400px at 50% 34%, #14603f, #072a1d 78%);"></div>

  <div style="position: relative; padding: 24px 20px 0; display: flex; justify-content: flex-end;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#b9e8d3" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
  </div>

  <div style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 0 36px;">

    <div style="width: 128px; height: 128px; border-radius: 999px; background: rgba(47,188,134,0.14); display: grid; place-items: center;">
      <div style="width: 92px; height: 92px; border-radius: 999px; background: #2fbc86; display: grid; place-items: center; box-shadow: 0 12px 30px rgb(18 133 93 / 0.28);">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#062a1d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5.2 5.2L20 6.8"></path></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <h1 style="margin: 0; font-size: 27px; font-weight: 800; letter-spacing: -0.02em; color: #ffffff; text-align: center;">Boîte authentifiée</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #d9f2e7; text-align: center; text-wrap: pretty;">Ce conditionnement correspond bien à un lot enregistré par le laboratoire.</p>
    </div>

    <div style="width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <span style="font-size: 12.5px; font-weight: 600; color: #b9e8d3;">Produit</span>
        <span style="font-size: 13.5px; font-weight: 800; color: #ffffff;">Amoxicilline Denk 1 g</span>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.1);"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <span style="font-size: 12.5px; font-weight: 600; color: #b9e8d3;">Numéro de lot</span>
        <span style="font-size: 13.5px; font-weight: 800; color: #ffffff; font-variant-numeric: tabular-nums;">#CI-4471</span>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.1);"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <span style="font-size: 12.5px; font-weight: 600; color: #b9e8d3;">Vérifié le</span>
        <span style="font-size: 13.5px; font-weight: 800; color: #ffffff; font-variant-numeric: tabular-nums;">4 sept. 2026, 12:47</span>
      </div>
    </div>
  </div>

  <div style="position: relative; padding: 0 20px 36px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 999px; background: #2fbc86;">
      <span style="font-size: 15px; font-weight: 800; color: #062a1d;">Scanner une autre boîte</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; height: 48px;">
      <span style="font-size: 14px; font-weight: 700; color: #b9e8d3;">Revenir à ma liste</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
