<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b3d2c" />
    <!--
      Ces trois titres reprennent mot pour mot le héros de la page. S'ils en
      divergent, le visiteur qui arrive depuis un partage ou un résultat de
      recherche lit une promesse et en trouve une autre. Modifier le héros,
      c'est modifier ces balises et regénérer og.jpg (design/generer-og.mjs),
      qui porte le même titre gravé dans l'image.
    -->
    <title>PharmaSur — Trouvez vos médicaments et les pharmacies proches en un clic</title>
    <link rel="canonical" href="%SITE_URL%/" />
    <meta
      name="description"
      content="PharmaSur classe les pharmacies proches de vous selon le nombre de médicaments de votre ordonnance réellement disponibles, en affiche le coût, et authentifie chaque boîte en un scan."
    />
    <meta
      property="og:title"
      content="PharmaSur — Trouvez vos médicaments et les pharmacies proches en un clic"
    />
    <meta
      property="og:description"
      content="Les pharmacies proches classées selon ce qu'elles ont vraiment en stock, le coût de l'ordonnance avant de sortir, et l'authenticité de chaque boîte en un scan."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_CI" />
    <meta property="og:site_name" content="PharmaSur" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Comptoir d'une pharmacie ivoirienne, surmonté du titre « Trouvez vos médicaments et les pharmacies proches en un clic »."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="PharmaSur — Trouvez vos médicaments et les pharmacies proches en un clic"
    />
    <meta
      name="twitter:description"
      content="Les pharmacies proches classées selon ce qu'elles ont vraiment en stock, le coût de l'ordonnance avant de sortir, et l'authenticité de chaque boîte en un scan."
    />
    <meta name="twitter:image" content="%SITE_URL%/og.jpg" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/plus-jakarta-sans.woff2"
      crossorigin
    />
    <!-- Fond du héros : visible d'emblée, donc préchargé selon la largeur d'écran. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/hero-officine.webp"
      media="(min-width: 1025px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/hero-officine-900.webp"
      media="(max-width: 1024px)"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
